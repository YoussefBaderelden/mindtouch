version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindtouch
      POSTGRES_PASSWORD: mindtouch_dev
      POSTGRES_DB: mindtouch
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindtouch']
      interval: 5s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: mindtouch
      POSTGRES_PASSWORD: mindtouch_dev
      POSTGRES_DB: mindtouch_ts
    ports:
      - '5433:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ../backend/api
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgresql://mindtouch:mindtouch_dev@postgres:5432/mindtouch
      TIMESCALE_URL: postgresql://mindtouch:mindtouch_dev@timescale:5432/mindtouch_ts
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  timescale_data:
